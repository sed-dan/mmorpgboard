<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>{% block title %}{% endblock title %}</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        {% load static %}
        <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
    </head>
    <body>
        <!-- Responsive navbar-->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="{% url 'post_list' %}">Доска объявлений</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        {% if user.is_authenticated %}
                        <li class="nav-item"><a class="nav-link" href="{% url 'post_create' %}">Объявление+</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'responses' %}">Отклики</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'user_profile' %}">Профиль</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'account_logout' %}">Выход</a></li>
                        {% else %}
                        <li class="nav-item"><a class="nav-link" href="{% url 'signup_page' %}">Регистрация</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'account_login' %}">Вход</a></li>
                        {% endif %}
                    </ul>
                </div>
            </div>
        </nav>
        <!-- Page content-->
        <div class="container">
            <div class="text-center mt-5">
                {% block content %}{% endblock content %}
            </div>
        </div>
    </body>
</html>
